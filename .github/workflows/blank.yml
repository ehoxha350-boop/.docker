name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Test API storage
        run: python -m unittest discover -s api/tests
      - name: Check web JavaScript
        run: npm --prefix web run check
